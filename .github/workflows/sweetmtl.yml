name: sweetmtl

# The Metal stack's iOS 16 arm64 binaries (docs/taimen-metal-plan.md 4.4, tools/sweetmtl/README.md): the test tools
# mtlbridgetest (the bridge's self-test) and mtlabitest (the frontend's object ABI), each flame's bridge +
# sweetmtl-runtime + the metal2vulkan translator (Rust), the Gallium shim + tools/sweetgl/sweet_drm.c and Mesa
# freedreno a5xx, signed ad hoc (tools/sweetmtl/build-ios.sh). Mesa is sweetgl's pin + mesa.patch +
# tools/sweetmtl/m0/mesa-a5xx-ir3.patch, in trees of its own (research/mesa-mtl, research/mesa-ios-mtl).

on:
  workflow_dispatch:
  push:
    branches:
      - taimen
      - "metal-*"
    paths:
      - "tools/sweetmtl/**"
      - ".github/workflows/sweetmtl.yml"
      # what the build takes from sweetgl: the Mesa pin and patch, the cross setup, the DRM emulation
      - "tools/sweetgl/env.sh"
      - "tools/sweetgl/mesa.patch"
      - "tools/sweetgl/mesa-fetch.sh"
      - "tools/sweetgl/mesa-setup.sh"
      - "tools/sweetgl/ios-cross.txt"
      - "tools/sweetgl/include/**"
      - "tools/sweetgl/sweet_drm.c"
      - "tools/sweetgl/sweet_drm.h"

# Own group: never cancels (or waits for) the other builds
concurrency:
  group: sweetmtl-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # sweetgl's toolchain (iPhoneOS 17.5 SDK); any Xcode with an SDK >= 16 works
  XCODE_PREFER: "15.4"
  # the PC's rustc (WSL m0 env), which built and ran the runtime
  RUST_TOOLCHAIN: "1.99.1"
  # Bump to throw away the caches below.
  CACHE_SALT: v1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  HOMEBREW_NO_AUTO_UPDATE: "1"
  MESA_SRC: ${{ github.workspace }}/research/mesa-mtl
  MESA_BUILD: ${{ github.workspace }}/research/mesa-ios-mtl
  CARGO_TARGET_DIR: ${{ github.workspace }}/tools/sweetmtl/out/cargo
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_"$XCODE_PREFER"*.app 2>/dev/null | sort -V | head -1)
          [ -n "$XC" ] || XC=$(dirname "$(dirname "$(xcode-select -p)")")
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR=$XC/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          echo "XCODE_VER=$(xcodebuild -version | head -1 | tr ' ' '_')" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deps
        run: |
          python -m pip install --disable-pip-version-check meson==1.8.2 ninja==1.11.1.1 \
            mako==1.3.10 PyYAML==6.0.2 packaging==24.2
          # Mesa's GLSL parser needs bison 3; macOS has 2.3 (its flex 2.6 is fine)
          brew install bison ccache
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          # llvm-as for the bridge's fixtures (metal2vulkan's LLVM text, LLVM 21 like the PC's)
          brew install llvm@21 || brew install llvm
          LLVM=$(brew --prefix llvm@21 2>/dev/null || true)
          [ -x "$LLVM/bin/llvm-as" ] || LLVM=$(brew --prefix llvm)
          echo "LLVM_AS=$LLVM/bin/llvm-as" >> "$GITHUB_ENV"
          "$LLVM/bin/llvm-as" --version
          meson --version
          ninja --version

      - name: Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-ios
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          rustc +"$RUST_TOOLCHAIN" -V
          cargo +"$RUST_TOOLCHAIN" -V

      - name: Cache Mesa tarball
        uses: actions/cache@v4
        with:
          path: research/mesa-dl
          key: mesa-dl-${{ hashFiles('tools/sweetgl/env.sh') }}

      # restore + save (always) instead of actions/cache: a failed build still
      # leaves its objects for the next run
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: sweetmtl-ccache-${{ env.CACHE_SALT }}-${{ env.XCODE_VER }}-${{ hashFiles('tools/sweetgl/env.sh', 'tools/sweetgl/mesa.patch', 'tools/sweetmtl/m0/mesa-a5xx-ir3.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sweetmtl-ccache-${{ env.CACHE_SALT }}-${{ env.XCODE_VER }}-${{ hashFiles('tools/sweetgl/env.sh', 'tools/sweetgl/mesa.patch', 'tools/sweetmtl/m0/mesa-a5xx-ir3.patch') }}-
            sweetmtl-ccache-${{ env.CACHE_SALT }}-${{ env.XCODE_VER }}-
            sweetgl-ccache-${{ env.CACHE_SALT }}-${{ env.XCODE_VER }}-

      # the translator pin and its patches, the bridge's lock file
      - name: Restore cargo
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ env.CARGO_TARGET_DIR }}
          key: sweetmtl-cargo-${{ env.CACHE_SALT }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('tools/sweetmtl/m2v-fetch.sh', 'tools/sweetmtl/patches/**', 'tools/sweetmtl/bridge/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sweetmtl-cargo-${{ env.CACHE_SALT }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('tools/sweetmtl/m2v-fetch.sh', 'tools/sweetmtl/patches/**', 'tools/sweetmtl/bridge/Cargo.lock') }}-

      - name: Fetch Mesa
        run: |
          sh tools/sweetgl/mesa-fetch.sh
          (cd "$MESA_SRC" && patch -p1 < "$GITHUB_WORKSPACE/tools/sweetmtl/m0/mesa-a5xx-ir3.patch")

      - name: Configure Mesa
        run: |
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          # the tree is unpacked fresh each run: ignore mtimes
          ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"
          ccache -z
          sh tools/sweetgl/mesa-setup.sh

      - name: Fetch the translator
        run: sh tools/sweetmtl/m2v-fetch.sh

      - name: Build
        env:
          # keep going after errors so one run reports every compile failure
          NINJA_FLAGS: "-k 0"
        run: tools/sweetmtl/build-ios.sh

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: sweetmtl-ccache-${{ env.CACHE_SALT }}-${{ env.XCODE_VER }}-${{ hashFiles('tools/sweetgl/env.sh', 'tools/sweetgl/mesa.patch', 'tools/sweetmtl/m0/mesa-a5xx-ir3.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save cargo
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ env.CARGO_TARGET_DIR }}
          key: sweetmtl-cargo-${{ env.CACHE_SALT }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('tools/sweetmtl/m2v-fetch.sh', 'tools/sweetmtl/patches/**', 'tools/sweetmtl/bridge/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Inspect
        run: |
          for f in tools/sweetmtl/out/ios/mtlbridgetest tools/sweetmtl/out/ios/mtlabitest; do
            file "$f"
            ls -la "$f" "$f.unstripped"
            otool -l "$f" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN' | head -6
            otool -L "$f"
            codesign -d --entitlements - "$f" 2>&1 | tail -8
          done

      - name: Collect
        run: |
          O=tools/sweetmtl/out/ios
          mkdir -p artifact symbols
          cp "$O/mtlbridgetest" "$O/mtlabitest" artifact/
          cp "$O/mtlbridgetest.unstripped" "$O/mtlabitest.unstripped" symbols/
          BH=$(shasum -a 256 artifact/mtlbridgetest | cut -c1-8)
          AH=$(shasum -a 256 artifact/mtlabitest | cut -c1-8)
          {
            echo "commit $GITHUB_SHA ($GITHUB_REF_NAME)"
            echo "run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            grep -E '^MESA_(VERSION|SHA256)=' tools/sweetgl/env.sh
            echo "mesa.patch $(shasum -a 256 tools/sweetgl/mesa.patch | cut -c1-16)," \
              "mesa-a5xx-ir3.patch $(shasum -a 256 tools/sweetmtl/m0/mesa-a5xx-ir3.patch | cut -c1-16)"
            echo "metal2vulkan $(git -C tools/sweetmtl/m2v rev-parse --short=8 HEAD) +" \
              "$(cd tools/sweetmtl/patches && ls *.patch | tr '\n' ' ')"
            rustc -V
            "$LLVM_AS" --version | grep -i version | head -1
            xcodebuild -version | tr '\n' ' '; echo
            echo "sdk $(xcrun --sdk iphoneos --show-sdk-path)"
            echo
            echo "Install (tools/sweetmtl/README.md, phone tests): one tool per boot, as a launchd job that runs"
            echo "once (--daemon: waits for SweetGPU, runs, prints, then idles); its output reaches the XNU log as"
            echo "|name| lines with boot-arg sweetlogp=mtlbridgetest,mtlabitest. mkrootfix.py arguments:"
            echo "  --zfile /usr/local/libexec/mtlbridgetest-$BH/mtlbridgetest=DIR/mtlbridgetest"
            echo "  --daemon com.sweet.mtlbridgetest=/usr/local/libexec/mtlbridgetest-$BH/mtlbridgetest,--daemon,/private/var/sweetmtl/cache,/System/Library/Frameworks/QuartzCore.framework/default.metallib"
            echo "or"
            echo "  --zfile /usr/local/libexec/mtlabitest-$AH/mtlabitest=DIR/mtlabitest"
            echo "  --daemon com.sweet.mtlabitest=/usr/local/libexec/mtlabitest-$AH/mtlabitest,--daemon"
          } > artifact/BUILDINFO.txt
          (cd artifact && shasum -a 256 mtlbridgetest mtlabitest > SHA256SUMS)
          (cd symbols && shasum -a 256 mtlbridgetest.unstripped mtlabitest.unstripped > SHA256SUMS)
          cat artifact/BUILDINFO.txt artifact/SHA256SUMS
          ls -la artifact symbols

      - uses: actions/upload-artifact@v4
        with:
          name: sweetmtl
          path: artifact/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: sweetmtl-symbols
          path: symbols/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sweetmtl-logs
          path: |
            research/mesa-ios-mtl/meson-logs/
            research/mesa-ios-mtl/compile_commands.json
            tools/sweetgl/out/ios-paths.txt
            tools/sweetmtl/out/ios/gallium/mesa-flags.rsp
            tools/sweetmtl/out/ios/gallium/mesa-libs.txt
          if-no-files-found: ignore
