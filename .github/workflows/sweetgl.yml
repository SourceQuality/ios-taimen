name: sweetgl

# sweetgl.dylib: Mesa freedreno (Adreno 540 on taimen) + the libdrm/msm
# emulation + the EAGL shim, for iOS 16 arm64 (docs/taimen-gpu-plan.md 4.4).
# Same steps as on the Pixel 1's Mac: tools/sweetgl/mesa-fetch.sh,
# mesa-setup.sh, build.sh, with Xcode's iPhoneOS SDK.

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/sweetgl/**"
      - ".github/workflows/sweetgl.yml"

# Own group: never cancels (or waits for) the kernel builds in xnu.yml
concurrency:
  group: sweetgl-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the Pixel 1's toolchain (iPhoneOS 17.5 SDK); any Xcode with an SDK >= 16 works
  XCODE_PREFER: "15.4"
  # Bump to throw away the caches below.
  CACHE_SALT: v1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_"$XCODE_PREFER"*.app 2>/dev/null | sort -V | head -1)
          [ -n "$XC" ] || XC=$(dirname "$(dirname "$(xcode-select -p)")")
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR=$XC/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          echo "XCODE_VER=$(xcodebuild -version | head -1 | tr ' ' '_')" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deps
        run: |
          python -m pip install --disable-pip-version-check meson==1.8.2 ninja==1.11.1.1 \
            mako==1.3.10 PyYAML==6.0.2 packaging==24.2
          # Mesa's GLSL parser needs bison 3; macOS has 2.3 (its flex 2.6 is fine)
          brew install bison ccache
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          meson --version
          ninja --version
          "$(brew --prefix bison)/bin/bison" --version | head -1
          flex --version

      - name: Cache Mesa tarball
        uses: actions/cache@v4
        with:
          path: research/mesa-dl
          key: mesa-dl-${{ hashFiles('tools/sweetgl/env.sh') }}

      # restore + save (always) instead of actions/cache: a failed build still
      # leaves its objects for the next run
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: sweetgl-ccache-${{ env.CACHE_SALT }}-${{ env.XCODE_VER }}-${{ hashFiles('tools/sweetgl/env.sh', 'tools/sweetgl/mesa.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sweetgl-ccache-${{ env.CACHE_SALT }}-${{ env.XCODE_VER }}-${{ hashFiles('tools/sweetgl/env.sh', 'tools/sweetgl/mesa.patch') }}-
            sweetgl-ccache-${{ env.CACHE_SALT }}-${{ env.XCODE_VER }}-

      - name: Fetch Mesa
        run: sh tools/sweetgl/mesa-fetch.sh

      - name: Configure Mesa
        run: |
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          # the tree is unpacked fresh each run: ignore mtimes
          ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"
          ccache -z
          sh tools/sweetgl/mesa-setup.sh

      - name: Build
        env:
          # keep going after errors so one run reports every compile failure
          NINJA_FLAGS: "-k 0"
        run: sh tools/sweetgl/build.sh

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: sweetgl-ccache-${{ env.CACHE_SALT }}-${{ env.XCODE_VER }}-${{ hashFiles('tools/sweetgl/env.sh', 'tools/sweetgl/mesa.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Inspect
        run: |
          D=tools/sweetgl/out/sweetgl-unpadded.dylib
          file "$D"
          lipo -info "$D"
          otool -l "$D" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN' | head -12
          otool -L "$D"
          nm -gU "$D"
          codesign -dv "$D" 2>&1
          EXPORTS=$(nm -gU "$D")
          for s in _sweetgl_init _sweetgl_create _sweetgl_make_current _sweetgl_destroy _sweetgl_selftest; do
            echo "$EXPORTS" | grep -q " T $s\$" || { echo "missing export $s"; exit 1; }
          done

      - name: Collect
        run: |
          mkdir -p artifact
          cp tools/sweetgl/out/sweetgl-unpadded.dylib artifact/sweetgl.dylib
          {
            echo "commit $GITHUB_SHA ($GITHUB_REF_NAME)"
            echo "run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            grep -E '^MESA_(VERSION|SHA256)=' tools/sweetgl/env.sh
            echo "mesa.patch $(shasum -a 256 tools/sweetgl/mesa.patch | cut -c1-16)"
            xcodebuild -version | tr '\n' ' '; echo
            echo "sdk $(xcrun --sdk iphoneos --show-sdk-path)"
            echo "install as /usr/lib/sweetgl.dylib, mode 0755 (unpadded; the 64 MiB padding was for the Pixel 1's push.sh)"
          } > artifact/BUILDINFO.txt
          (cd artifact && shasum -a 256 sweetgl.dylib > SHA256SUMS)
          cat artifact/BUILDINFO.txt artifact/SHA256SUMS
          ls -la artifact

      - uses: actions/upload-artifact@v4
        with:
          name: sweetgl-dylib
          path: artifact/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sweetgl-logs
          path: |
            research/mesa-ios/meson-logs/
            research/mesa-ios/compile_commands.json
            tools/sweetgl/out/ios-paths.txt
          if-no-files-found: ignore
